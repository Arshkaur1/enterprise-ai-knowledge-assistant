[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "An enterprise document intelligence system using local LLMs and RAG"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
llm = ["ollama>=0.4", "python-dotenv>=1.0"]
documents = ["pymupdf>=1.24", "python-docx>=1.1"]
embeddings = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"