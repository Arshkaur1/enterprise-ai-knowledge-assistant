
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "An enterprise document intelligence system using local LLMs and RAG"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
llm = [
    "ollama>=0.4",
    "python-dotenv>=1.0"
]

documents = [
    "pymupdf>=1.24",
    "python-docx>=1.1"
]

embeddings = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8"
]

retrieval = [
    "rank-bm25>=0.2.2"
]

api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.40",
    "requests>=2.31"
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring real models and retrieval artifacts",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[project.scripts]
knowledge-assistant = "knowledge_assistant.qa_cli:main"
